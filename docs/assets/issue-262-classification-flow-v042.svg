<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Classifarr Classification Flow v0.42.0-alpha</title>
  <desc id="desc">Flow diagram showing ingest, classification pipeline, decision branches, retry loop, routing, and learning update.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd" />
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .group { fill: #111827; stroke: #334155; stroke-width: 2; rx: 16; }
      .group-title { fill: #cbd5e1; font: 600 22px 'Segoe UI', Roboto, Arial, sans-serif; }
      .title { fill: #f8fafc; font: 700 30px 'Segoe UI', Roboto, Arial, sans-serif; }
      .subtitle { fill: #93c5fd; font: 500 16px 'Segoe UI', Roboto, Arial, sans-serif; }

      .node { stroke-width: 2; rx: 14; }
      .node-main { fill: #1e293b; stroke: #3b82f6; }
      .node-optional { fill: #312e81; stroke: #818cf8; }
      .node-action { fill: #052e16; stroke: #22c55e; }
      .node-attn { fill: #3f1d1d; stroke: #ef4444; }

      .node-text { fill: #f8fafc; font: 600 17px 'Segoe UI', Roboto, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .node-sub { fill: #cbd5e1; font: 500 13px 'Segoe UI', Roboto, Arial, sans-serif; text-anchor: middle; }

      .decision { fill: #3b2f0b; stroke: #f59e0b; stroke-width: 2; }
      .decision-text { fill: #fef3c7; font: 600 15px 'Segoe UI', Roboto, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }

      .edge { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .edge-soft { stroke: #60a5fa; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .edge-label { fill: #bfdbfe; font: 600 14px 'Segoe UI', Roboto, Arial, sans-serif; }

      .legend-title { fill: #e2e8f0; font: 600 16px 'Segoe UI', Roboto, Arial, sans-serif; }
      .legend-text { fill: #cbd5e1; font: 500 13px 'Segoe UI', Roboto, Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1600" />

  <text class="title" x="800" y="42" text-anchor="middle">Classifarr Classification Flow</text>
  <text class="subtitle" x="800" y="68" text-anchor="middle">Issue 262 / v0.42.0-alpha</text>

  <rect class="group" x="360" y="90" width="520" height="700" />
  <text class="group-title" x="386" y="128">Ingest + Classification Pipeline</text>

  <rect class="group" x="60" y="840" width="1420" height="560" />
  <text class="group-title" x="86" y="878">Decision, Resolution, Routing, and Learning</text>

  <!-- Main vertical pipeline -->
  <rect class="node node-main" x="470" y="150" width="260" height="84" />
  <text class="node-text" x="600" y="185">Request Ingested</text>
  <text class="node-sub" x="600" y="209">Overseerr / Jellyseerr / Seer / Manual</text>

  <rect class="node node-main" x="470" y="260" width="260" height="84" />
  <text class="node-text" x="600" y="302">Queued</text>

  <rect class="node node-main" x="470" y="370" width="260" height="84" />
  <text class="node-text" x="600" y="412">Metadata Fetch</text>

  <rect class="node node-main" x="470" y="480" width="260" height="84" />
  <text class="node-text" x="600" y="522">Policy Evaluation</text>

  <rect class="node node-main" x="470" y="590" width="260" height="84" />
  <text class="node-text" x="600" y="632">RAG Analysis</text>

  <rect class="node node-main" x="470" y="700" width="260" height="84" />
  <text class="node-text" x="600" y="742">Signal Combination</text>

  <polygon class="decision" points="600,840 690,910 600,980 510,910" />
  <text class="decision-text" x="600" y="902">AI Analysis</text>
  <text class="decision-text" x="600" y="922">Needed?</text>

  <rect class="node node-optional" x="860" y="870" width="260" height="84" />
  <text class="node-text" x="990" y="912">AI Analysis</text>

  <rect class="node node-main" x="470" y="1010" width="260" height="84" />
  <text class="node-text" x="600" y="1052">Decision</text>

  <polygon class="decision" points="600,1125 690,1195 600,1265 510,1195" />
  <text class="decision-text" x="600" y="1188">Decision</text>
  <text class="decision-text" x="600" y="1208">Outcome</text>

  <rect class="node node-action" x="920" y="1140" width="260" height="84" />
  <text class="node-text" x="1050" y="1182">Route to Radarr/Sonarr</text>

  <rect class="node node-attn" x="470" y="1295" width="260" height="84" />
  <text class="node-text" x="600" y="1337">Notification / Needs Attention</text>

  <rect class="node node-main" x="470" y="1405" width="260" height="84" />
  <text class="node-text" x="600" y="1442">User Resolution</text>
  <text class="node-sub" x="600" y="1464">Confirm / Change / Yes-No</text>

  <rect class="node node-attn" x="120" y="1140" width="260" height="84" />
  <text class="node-text" x="250" y="1182">Error / Retry Path</text>

  <polygon class="decision" points="250,1275 340,1345 250,1415 160,1345" />
  <text class="decision-text" x="250" y="1338">Retry</text>
  <text class="decision-text" x="250" y="1358">Successful?</text>

  <rect class="node node-action" x="920" y="1405" width="260" height="84" />
  <text class="node-text" x="1050" y="1442">Learning / Pattern Update</text>

  <!-- Edges -->
  <line class="edge" x1="600" y1="234" x2="600" y2="260" />
  <line class="edge" x1="600" y1="344" x2="600" y2="370" />
  <line class="edge" x1="600" y1="454" x2="600" y2="480" />
  <line class="edge" x1="600" y1="564" x2="600" y2="590" />
  <line class="edge" x1="600" y1="674" x2="600" y2="700" />
  <line class="edge" x1="600" y1="784" x2="600" y2="840" />

  <line class="edge" x1="600" y1="980" x2="600" y2="1010" />
  <line class="edge" x1="600" y1="1094" x2="600" y2="1125" />

  <line class="edge" x1="690" y1="910" x2="860" y2="912" />
  <text class="edge-label" x="760" y="892">Yes</text>

  <path class="edge" d="M 990 954 L 990 1060 L 730 1060" />
  <text class="edge-label" x="1002" y="1028">AI result</text>

  <line class="edge" x1="600" y1="1265" x2="600" y2="1295" />
  <text class="edge-label" x="618" y="1288">Awaiting decision</text>

  <line class="edge" x1="600" y1="1379" x2="600" y2="1405" />
  <line class="edge" x1="730" y1="1447" x2="920" y2="1182" />

  <line class="edge" x1="690" y1="1195" x2="920" y2="1182" />
  <text class="edge-label" x="752" y="1172">Auto-route</text>

  <line class="edge" x1="510" y1="1195" x2="380" y2="1182" />
  <text class="edge-label" x="356" y="1166">Error/timeout</text>

  <line class="edge" x1="250" y1="1224" x2="250" y2="1275" />

  <path class="edge-soft" d="M 250 1275 L 80 1275 L 80 302 L 470 302" />
  <text class="edge-label" x="88" y="334">Yes - retry</text>

  <line class="edge-soft" x1="340" y1="1345" x2="470" y2="1337" />
  <text class="edge-label" x="360" y="1322">No</text>

  <line class="edge" x1="1050" y1="1224" x2="1050" y2="1405" />

  <!-- Legend -->
  <rect class="group" x="1220" y="100" width="320" height="250" />
  <text class="legend-title" x="1244" y="132">Legend</text>

  <rect class="node node-main" x="1244" y="148" width="26" height="20" rx="4" />
  <text class="legend-text" x="1282" y="163">Core pipeline step</text>

  <rect class="node node-optional" x="1244" y="178" width="26" height="20" rx="4" />
  <text class="legend-text" x="1282" y="193">Optional AI step</text>

  <rect class="node node-action" x="1244" y="208" width="26" height="20" rx="4" />
  <text class="legend-text" x="1282" y="223">Routing / learning action</text>

  <rect class="node node-attn" x="1244" y="238" width="26" height="20" rx="4" />
  <text class="legend-text" x="1282" y="253">Attention / error path</text>

  <polygon class="decision" points="1257,271 1270,283 1257,295 1244,283" />
  <text class="legend-text" x="1282" y="287">Decision branch</text>
</svg>

