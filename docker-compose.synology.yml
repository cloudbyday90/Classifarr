# Docker Compose for Classifarr on Synology NAS
# Setup, permissions and safe updates: docs/installation/synology.md

services:
  classifarr:
    image: ghcr.io/cloudbyday90/classifarr:latest
    container_name: classifarr
    ports:
      - "21324:21324"
    environment:
      # Compatibility defaults, not a guarantee of your NAS user's identity.
      # Check both IDs with: id <username>. Preserve IDs on existing installs.
      - PUID=${PUID:-1026}
      - PGID=${PGID:-100}
      - UMASK=${UMASK:-022}
      # Application settings
      - NODE_ENV=production
      - TZ=${TZ:-UTC}
    volumes:
      # Dedicated application data, including PostgreSQL. Create this directory
      # first; never point it at a media share or a parent shared folder.
      - type: bind
        source: ${CLASSIFARR_APPDATA_PATH:-/volume1/docker/classifarr}
        target: /app/data
        bind:
          create_host_path: false
      # Optional media access: docker-compose.synology.media.yml.
      # API-only routing does not need a filesystem mount.
    restart: unless-stopped
    stop_grace_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:21324/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - classifarr_internal

networks:
  classifarr_internal:
    name: classifarr_internal
