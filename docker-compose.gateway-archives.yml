# Optional standalone services. Use explicitly; never included by the normal compose file.
# Pre-create private UID/GID 1000 directories and provision the two restricted DB roles.
services:
  gateway-archiver:
    image: ${CLASSIFARR_GATEWAY_ARCHIVE_IMAGE:?Set the tested immutable Classifarr image ID}
    entrypoint: ["node", "/app/src/scripts/runGatewayArchiveWorker.mjs"]
    user: "1000:1000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 32
    stop_grace_period: 130s
    restart: "no"
    environment:
      CLASSIFARR_GATEWAY_ARCHIVE_WORKER_CONFIG_FILE: /run/archive-config.json
    volumes:
      - ${CLASSIFARR_GATEWAY_ARCHIVE_CONFIG:?Set private config path}:/run/archive-config.json:ro
      - ${CLASSIFARR_GATEWAY_ARCHIVE_SOCKET:?Set source PostgreSQL socket directory}:/source-socket:ro
      - ${CLASSIFARR_GATEWAY_ARCHIVE_DIRECTORY:?Set private managed archive directory}:/archives
      - ${CLASSIFARR_GATEWAY_ARCHIVE_RECEIPTS:?Set private receipt directory}:/receipts:ro
    tmpfs:
      - /tmp:size=16m,uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev
  gateway-archive-verifier:
    image: ${CLASSIFARR_GATEWAY_ARCHIVE_IMAGE:?Set the tested immutable Classifarr image ID}
    entrypoint: ["node", "/app/src/scripts/runGatewayArchiveVerifier.mjs"]
    user: "1000:1000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1
    pids_limit: 64
    stop_grace_period: 190s
    restart: "no"
    volumes:
      - ${CLASSIFARR_GATEWAY_ARCHIVE_DIRECTORY:?Set private managed archive directory}:/archives:ro
      - ${CLASSIFARR_GATEWAY_ARCHIVE_RECEIPTS:?Set private receipt directory}:/receipts
    tmpfs:
      - /verification:size=1g,uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev
      - /tmp:size=16m,uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev
