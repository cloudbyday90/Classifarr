name: Trivy Security Scan

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'logo/**'
  push:
    branches: [ main ]
    tags:
      - "v*"
  schedule:
    # Weekly scan on Tuesday at 02:00 UTC (staggered from CodeQL on Monday)
    - cron: '0 2 * * 2'

jobs:
  trivy-fs:
    name: Filesystem Vulnerability & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Required to upload SARIF to GitHub Security tab
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # SARIF pass: upload all HIGH/CRITICAL findings to the Security tab
      - name: Run Trivy (SARIF upload)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif
          limit-severities-for-sarif: true
          skip-dirs: .git,node_modules,server/node_modules,client/node_modules,client/dist,client/coverage,server/coverage,data,.tmp

      - name: Upload Trivy FS results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      # Table pass: gate the PR/push on exit code (fail on HIGH/CRITICAL)
      - name: Run Trivy (PR gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-dirs: .git,node_modules,server/node_modules,client/node_modules,client/dist,client/coverage,server/coverage,data,.tmp
          skip-setup-trivy: true  # Trivy already installed by the previous step

  trivy-config:
    name: Dockerfile & Docker Compose Misconfig Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Scans Dockerfile and docker-compose*.yml against CIS Docker Benchmark
      - name: Run Trivy (IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config-results.sarif

      - name: Upload Trivy config results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        if: always()
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config
