name: Published ARM64 Recovery

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Classifarr release tag
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  published-arm64-recovery:
    if: github.repository == 'cloudbyday90/Classifarr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Checkout rehearsal harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Check published rehearsal contract
        run: node --test scripts/__tests__/published-arm64-recovery.test.mjs
      - name: Rehearse scheduled crash recovery on the published image
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/run-published-arm64-recovery.mjs
      - name: Upload published arm64 recovery receipt
        if: ${{ !cancelled() && (steps.recovery.outcome == 'success' || steps.recovery.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-arm64-recovery
          path: .tmp/ci/published-arm64-recovery.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized startup diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-arm64-recovery-diagnostics
          path: .tmp/published-upgrade/classifarr-upgrade-drill-*/failure.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
