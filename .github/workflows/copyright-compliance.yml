name: Copyright Compliance

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'logo/**'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'logo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copyright-check:
    name: Check Copyright Headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
      - name: Install root dependencies
        run: npm install
      - name: Check copyright headers
        run: npm run check-copyright
