name: Copyright Compliance

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  copyright-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v3
        with:
          node-version: '24.11.0'
      - run: npm install
      - run: npm run check-copyright
