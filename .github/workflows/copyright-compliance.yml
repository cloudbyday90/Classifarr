name: Copyright Compliance

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'logo/**'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'logo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copyright-check:
    name: Check Copyright Headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Set up npm and npx
        run: npm install --global npm@12.2.0 && npm --version && npx --version
      - name: Install root dependencies
        run: npm ci
      - name: Check root tooling dependency security and compatibility
        run: npm run test:tooling:dependencies
      - name: Check copyright headers
        run: npm run check-copyright
