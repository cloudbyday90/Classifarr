name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "cleanup"
        type: choice
        options:
          - cleanup
          - ci

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'ci'
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Validate migration naming
        run: node scripts/check-migrations.js

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Audit server runtime dependencies
        run: |
          cd server
          npm audit --omit=dev

      - name: Check test console spies
        run: node scripts/check-test-console-spies.js

      - name: Lint server tests
        run: |
          cd server
          npm run lint:tests

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Audit client runtime dependencies
        run: |
          cd client
          npm audit --omit=dev

      - name: Run server tests
        run: |
          cd server
          npm run test:ci

      - name: Run client tests
        run: |
          cd client
          npm run test:ci

      - name: Coverage ratchet check
        run: npm run coverage:ratchet:check

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Generate test password for Docker build
        run: |
          mkdir -p data
          echo "test_password_for_ci" > data/postgres_password

      - name: Build Docker image (verification)
        run: docker build -t classifarr:test .

  database-tests:
    name: Tests with Database
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: classifarr
          POSTGRES_USER: classifarr
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Setup database paths for CI
        run: |
          sudo mkdir -p /app/database
          sudo cp -r database/migrations /app/database/

      - name: Initialize database
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U classifarr -d classifarr -f database/init.sql

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Run tests with database available
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: classifarr
          POSTGRES_USER: classifarr
          POSTGRES_PASSWORD: test_password
          NODE_ENV: test
        run: |
          cd server
          # Run tests with database available for future integration tests
          # Current tests are unit tests with mocks
          npm test

  docker-release:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            cloudbyday90/classifarr
          tags: |
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PGVECTOR_BUILD=multi
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-old-releases:
    name: Cleanup Old Container Images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker-release

    permissions:
      packages: write

    steps:
      - name: Delete old GHCR packages (keep last 5)
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'classifarr'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

      - name: Get Docker Hub token
        id: docker-token
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get and delete old Docker Hub tags (keep last 5)
        run: |
          set -euo pipefail
          
          TOKEN="${{ steps.docker-token.outputs.token }}"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Docker Hub token is missing/invalid. Ensure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are set."
            exit 1
          fi
          
          KEEP_COUNT=5
          REPO="cloudbyday90/classifarr"
          
          # Fetch all tags (paginated), then delete everything except:
          # - latest (if present)
          # - the newest $KEEP_COUNT tags by last_updated (excluding latest)
          NEXT_URL="https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100"
          ALL="[]"
          
          while [ -n "$NEXT_URL" ] && [ "$NEXT_URL" != "null" ]; do
            RESP="$(curl --fail-with-body -sSL -H "Authorization: Bearer ${TOKEN}" "$NEXT_URL")"
            ALL="$(jq -s ".[0] + .[1].results" <(echo "$ALL") <(echo "$RESP"))"
            NEXT_URL="$(echo "$RESP" | jq -r ".next")"
          done
          
          TAGS_SORTED="$(echo "$ALL" | jq -r "sort_by(.last_updated) | .[].name")"
          TAG_COUNT="$(echo "$TAGS_SORTED" | grep -v "^latest$" | wc -l | tr -d " ")"
          
          echo "Docker Hub tags (excluding latest): $TAG_COUNT"
          
          if [ "$TAG_COUNT" -le "$KEEP_COUNT" ]; then
            echo "Only $TAG_COUNT tags exist, keeping all (minimum is $KEEP_COUNT)"
            exit 0
          fi
          
          DELETE_COUNT="$((TAG_COUNT - KEEP_COUNT))"
          echo "Deleting $DELETE_COUNT old tags from Docker Hub (keeping newest $KEEP_COUNT + latest)..."
          
          TAGS_TO_DELETE="$(echo "$TAGS_SORTED" | grep -v "^latest$" | head -n "$DELETE_COUNT")"
          
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting tag: $TAG"
            curl --fail-with-body -sSL -X DELETE \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${REPO}/tags/${TAG}/" >/dev/null
            sleep 0.1
          done <<< "$TAGS_TO_DELETE"

  cleanup-old-releases-manual:
    name: Cleanup Old Container Images (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cleanup'

    permissions:
      packages: write

    steps:
      - name: Delete old GHCR packages (keep last 5)
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'classifarr'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

      - name: Get Docker Hub token
        id: docker-token
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get and delete old Docker Hub tags (keep last 5)
        run: |
          set -euo pipefail
          
          TOKEN="${{ steps.docker-token.outputs.token }}"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Docker Hub token is missing/invalid. Ensure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are set."
            exit 1
          fi
          
          KEEP_COUNT=5
          REPO="cloudbyday90/classifarr"
          
          # Fetch all tags (paginated), then delete everything except:
          # - latest (if present)
          # - the newest $KEEP_COUNT tags by last_updated (excluding latest)
          NEXT_URL="https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100"
          ALL="[]"
          
          while [ -n "$NEXT_URL" ] && [ "$NEXT_URL" != "null" ]; do
            RESP="$(curl --fail-with-body -sSL -H "Authorization: Bearer ${TOKEN}" "$NEXT_URL")"
            ALL="$(jq -s ".[0] + .[1].results" <(echo "$ALL") <(echo "$RESP"))"
            NEXT_URL="$(echo "$RESP" | jq -r ".next")"
          done
          
          TAGS_SORTED="$(echo "$ALL" | jq -r "sort_by(.last_updated) | .[].name")"
          TAG_COUNT="$(echo "$TAGS_SORTED" | grep -v "^latest$" | wc -l | tr -d " ")"
          
          echo "Docker Hub tags (excluding latest): $TAG_COUNT"
          
          if [ "$TAG_COUNT" -le "$KEEP_COUNT" ]; then
            echo "Only $TAG_COUNT tags exist, keeping all (minimum is $KEEP_COUNT)"
            exit 0
          fi
          
          DELETE_COUNT="$((TAG_COUNT - KEEP_COUNT))"
          echo "Deleting $DELETE_COUNT old tags from Docker Hub (keeping newest $KEEP_COUNT + latest)..."
          
          TAGS_TO_DELETE="$(echo "$TAGS_SORTED" | grep -v "^latest$" | head -n "$DELETE_COUNT")"
          
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting tag: $TAG"
            curl --fail-with-body -sSL -X DELETE \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${REPO}/tags/${TAG}/" >/dev/null
            sleep 0.1
          done <<< "$TAGS_TO_DELETE"
