name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "cleanup"
        type: choice
        options:
          - cleanup
          - ci

env:
  REGISTRY: ghcr.io
  # OCI repository names must be lowercase. Keep this aligned with the
  # published-digest consumer contract and Docker Hub image name.
  IMAGE_NAME: cloudbyday90/classifarr

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'ci'
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Set up npm and npx
        run: npm install --global npm@12.0.2 && npm --version && npx --version

      - name: Validate migration naming
        run: npm run migration:check

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Check release provenance workflow contract
        run: |
          cd server
          npm run check:release-provenance

      - name: Check published digest consumer smoke Compose contract
        run: |
          cd server
          npm run check:release-consumer-smoke

      - name: Check AI provider fault release receipt contract
        run: |
          cd server
          npm run check:ai-provider-fault-receipt

      - name: Check release candidate publication workflow contract
        run: |
          cd server
          npm run check:release-candidate-publication

      - name: Check release installation evidence workflow contract
        run: |
          cd server
          npm run check:release-installation-evidence

      - name: Validate server dependency tree
        run: |
          cd server
          npm ls --all --omit=dev 2>&1 | grep -qiE "missing|invalid" && exit 1 || true

      - name: Audit server runtime dependencies
        run: |
          cd server
          npm audit --omit=dev

      - name: Check server dependency declarations (knip)
        run: |
          cd server
          npm run lint:knip

      - name: Check server production dependency declarations (knip --production)
        run: |
          cd server
          npm run lint:knip:production

      - name: Check test console spies
        run: node scripts/check-test-console-spies.mjs

      - name: Lint server tests
        run: |
          cd server
          npm run lint:tests

      - name: Lint server security rules
        run: |
          cd server
          npm run lint:security

      - name: Typecheck server
        run: |
          cd server
          npm run typecheck

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Install Playwright Chromium for production asset smoke
        run: |
          cd client
          npx playwright install --with-deps chromium

      - name: Audit client runtime dependencies
        run: |
          cd client
          npm audit --omit=dev

      - name: Lint client
        run: |
          cd client
          npm run lint

      - name: Typecheck client
        run: |
          cd client
          npm run typecheck

      - name: Run server tests
        run: |
          cd server
          npm run test:ci

      - name: Run client tests
        run: |
          cd client
          npm run test:ci

      - name: Generate ESM mock-shape report
        if: always()
        run: npm run esm:report-test-mock-shapes:artifact

      - name: Generate strict ESM mock-shape report
        if: always()
        run: npm run esm:report-test-mock-shapes:strict:artifact

      - name: Upload ESM mock-shape report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esm-test-mock-shapes
          path: .tmp/ci/esm-test-mock-shapes.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload strict ESM mock-shape report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esm-test-mock-shapes-strict
          path: .tmp/ci/esm-test-mock-shapes-strict.json
          if-no-files-found: warn
          retention-days: 14

      - name: Generate ESM mock-shape summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;
          if (!summaryFile) process.exit(0);
          
          try {
            const serviceJson = fs.readFileSync(path.join(process.cwd(), '.tmp/ci/esm-test-mock-shapes.json'), 'utf8');
            const strictJson = fs.readFileSync(path.join(process.cwd(), '.tmp/ci/esm-test-mock-shapes-strict.json'), 'utf8');
            
            const serviceCandidates = JSON.parse(serviceJson);
            const strictCandidates = JSON.parse(strictJson);
            
            // Count by category
            const countByCategory = (candidates) => {
              const counts = {};
              candidates.forEach(c => {
                counts[c.category] = (counts[c.category] || 0) + 1;
              });
              return counts;
            };
            
            const serviceCounts = countByCategory(serviceCandidates);
            const strictCounts = countByCategory(strictCandidates);
            
            // Build summary markdown
            let summary = '## ESM Test Mock-Shape Report\n\n';
            summary += '### Service Mode (Regression Gate)\n';
            summary += \`Total candidates: \${serviceCandidates.length}\n\`;
            summary += '| Category | Count |\n|----------|-------|\n';
            Object.entries(serviceCounts).sort().forEach(([cat, count]) => {
              summary += \`| \${cat} | \${count} |\n\`;
            });
            
            summary += '\n### Strict Mode (Trend Tracking)\n';
            summary += \`Total candidates: \${strictCandidates.length}\n\`;
            if (strictCandidates.length === 0) {
              summary += '✅ **All strict violations cleared!**\n';
            } else {
              summary += '| Category | Count |\n|----------|-------|\n';
              Object.entries(strictCounts).sort().forEach(([cat, count]) => {
                summary += \`| \${cat} | \${count} |\n\`;
              });
            }
            
            fs.appendFileSync(summaryFile, summary);
          } catch (error) {
            console.warn('Could not generate mock-shape summary:', error.message);
          }
          "

      - name: Coverage ratchet check
        run: npm run coverage:ratchet:check

      - name: Run production policy-route asset smoke
        run: |
          cd client
          npm run test:browser:production-policy

      - name: Upload production policy-route asset smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-policy-route-asset-smoke
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Generate test password for Docker build
        run: |
          mkdir -p data
          echo "test_password_for_ci" > data/postgres_password

      - name: Build Docker image (verification)
        run: docker build -t classifarr:test .

      - name: Check schema snapshot drift
        run: |
          IMAGE_NAME=classifarr:test node scripts/check-schema-snapshot-container.mjs

      - name: Smoke test missing pg_stat_statements startup recovery
        run: |
          IMAGE_NAME=classifarr:test npm run docker:smoke:pgss

  policy-candidate-synthetic-replay:
    name: Policy Candidate Synthetic Replay
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Run offline synthetic policy-candidate replay
        run: node scripts/run-policy-candidate-synthetic-replay-evaluation.mjs

  database-tests:
    name: Tests with Database
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'ci')

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Set up npm and npx
        run: npm install --global npm@12.0.2 && npm --version && npx --version

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Run integration tests
        env:
          NODE_ENV: test
        run: |
          cd server
          npm run test:integration

  release-acceptance:
    name: Release Acceptance Readout
    runs-on: ubuntu-latest
    needs: [build-and-test, database-tests]
    if: |
      always() && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'ci')
      )

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Assemble release acceptance readout
        run: |
          if [ "${{ needs.build-and-test.result }}" = "success" ]; then
            REPOSITORY_VALIDATION="passed"
          else
            REPOSITORY_VALIDATION="blocked"
          fi

          if [ "${{ needs.database-tests.result }}" = "success" ]; then
            ISOLATED_RUNTIME_ACCEPTANCE="passed"
          else
            ISOLATED_RUNTIME_ACCEPTANCE="blocked"
          fi

          node scripts/generate-policy-release-acceptance-readout.mjs \
            --mode ci \
            --source-revision "${{ github.sha }}" \
            --repository-validation "$REPOSITORY_VALIDATION" \
            --isolated-runtime-acceptance "$ISOLATED_RUNTIME_ACCEPTANCE" \
            --output .tmp/ci/policy-release-acceptance-readout.json \
            --require-passed

      - name: Upload release acceptance readout artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-release-acceptance-readout
          path: .tmp/ci/policy-release-acceptance-readout.json
          if-no-files-found: warn
          retention-days: 14

  release-candidate-provider-fault-receipt:
    name: Release Candidate Provider Fault Receipt
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-acceptance]
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Set up npm and npx
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          npm --version
          npx --version

      - name: Install server dependencies
        run: |
          set -euo pipefail
          cd server
          npm ci

      - name: Run isolated AI provider fault integration
        id: run-provider-fault-compose-integration
        continue-on-error: true
        env:
          CLASSIFARR_AI_PROVIDER_FAULT_RECEIPT_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run test:integration:ai-provider-fault-compose

      - name: Verify bounded AI provider fault receipt
        if: always()
        env:
          CLASSIFARR_AI_PROVIDER_FAULT_RECEIPT_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/check-ai-provider-fault-compose-receipt.mjs

      - name: Upload bounded AI provider fault receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-provider-fault-compose-receipt
          path: .tmp/ci/ai-provider-fault-compose-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce AI provider fault integration outcome
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.run-provider-fault-compose-integration.outcome }}" = "success"

  docker-release:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, database-tests, release-acceptance, release-candidate-provider-fault-receipt]
    outputs:
      image_digest: ${{ steps.build-and-push-image.outputs.digest }}

    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            cloudbyday90/classifarr
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        id: build-and-push-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PGVECTOR_BUILD=multi
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest GHCR image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push-image.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/cloudbyday90/classifarr
          subject-digest: ${{ steps.build-and-push-image.outputs.digest }}
          push-to-registry: true

      - name: Verify container image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build-and-push-image.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          EXPECTED_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/ci.yml
        run: |
          set -euo pipefail

          verify_image() {
            local image_uri="$1"
            local attempt

            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$image_uri" \
                --repo "$SOURCE_REPOSITORY" \
                --signer-workflow "$EXPECTED_SIGNER_WORKFLOW" \
                --source-digest "$SOURCE_REVISION" \
                --deny-self-hosted-runners; then
                return 0
              fi

              if [ "$attempt" -lt 5 ]; then
                sleep 5
              fi
            done

            return 1
          }

          verify_image "oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          verify_image "oci://docker.io/cloudbyday90/classifarr@${IMAGE_DIGEST}"

          {
            echo '### Verified container image provenance'
            echo
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- GHCR: \`oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}\`"
            echo "- Docker Hub: \`oci://docker.io/cloudbyday90/classifarr@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  published-digest-consumer-smoke:
    name: Published Digest Consumer Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [docker-release]

    permissions:
      attestations: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Run published digest consumer smoke
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.docker-release.outputs.image_digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run release:smoke:published-digest -- \
            --image "ghcr.io/cloudbyday90/classifarr@${IMAGE_DIGEST}" \
            --source-revision "$SOURCE_REVISION"

      - name: Verify published latest image alias
        env:
          IMAGE_DIGEST: ${{ needs.docker-release.outputs.image_digest }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/cloudbyday90/classifarr"
          RELEASE_REFERENCE="${IMAGE}@${IMAGE_DIGEST}"
          RELEASE_DIGEST="$(docker buildx imagetools inspect "$RELEASE_REFERENCE" | sed -n 's/^Digest:[[:space:]]*//p')"
          LATEST_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:latest" | sed -n 's/^Digest:[[:space:]]*//p')"

          test "$RELEASE_DIGEST" = "$IMAGE_DIGEST"
          test "$LATEST_DIGEST" = "$IMAGE_DIGEST"

          MANIFEST_DIGESTS="$(docker buildx imagetools inspect --raw "$RELEASE_REFERENCE" | jq -er '[.manifests[]?.digest | select(type == "string")] | unique[]')"
          test -n "$MANIFEST_DIGESTS"
          while IFS= read -r MANIFEST_DIGEST; do
            docker buildx imagetools inspect "${IMAGE}@${MANIFEST_DIGEST}" >/dev/null
          done <<< "$MANIFEST_DIGESTS"

          docker pull "${IMAGE}:latest"

      - name: Upload published digest consumer smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-digest-consumer-smoke
          path: .tmp/release-consumer-smoke/
          if-no-files-found: error
          retention-days: 90

  release-candidate-publication:
    name: Release Candidate Publication
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-acceptance, release-candidate-provider-fault-receipt, docker-release, published-digest-consumer-smoke]
    environment: release-publication

    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Check release candidate version contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm run release:check-candidate-version -- --tag "$RELEASE_TAG"

      - name: Download CI release acceptance readout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-release-acceptance-readout
          path: .tmp/release-candidate/ci-readout

      - name: Download published digest consumer smoke evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-digest-consumer-smoke
          path: .tmp/release-candidate/consumer-smoke

      - name: Download bounded AI provider fault receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-provider-fault-compose-receipt
          path: .tmp/release-candidate/provider-fault-receipt

      - name: Assemble release candidate evidence
        env:
          IMAGE_DIGEST: ${{ needs.docker-release.outputs.image_digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run release:assemble-candidate-evidence -- \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION" \
            --digest "$IMAGE_DIGEST" \
            --ci-readout .tmp/release-candidate/ci-readout/policy-release-acceptance-readout.json \
            --consumer-smoke .tmp/release-candidate/consumer-smoke/${SOURCE_REVISION}-published-digest-consumer-smoke.json \
            --provider-fault-receipt .tmp/release-candidate/provider-fault-receipt/ai-provider-fault-compose-receipt.json

      - name: Attest release candidate evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .tmp/release-candidate/${{ github.ref_name }}-evidence.json

      - name: Verify release candidate evidence attestation
        env:
          EVIDENCE_PATH: .tmp/release-candidate/${{ github.ref_name }}-evidence.json
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          EXPECTED_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/ci.yml
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$EVIDENCE_PATH" \
              --repo "$SOURCE_REPOSITORY" \
              --signer-workflow "$EXPECTED_SIGNER_WORKFLOW" \
              --source-digest "$SOURCE_REVISION" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --predicate-type 'https://slsa.dev/provenance/v1' \
              --deny-self-hosted-runners > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-evidence
          path: .tmp/release-candidate/
          if-no-files-found: error
          retention-days: 90

      - name: Create and verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          release_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          gh release create "$RELEASE_TAG" \
            ".tmp/release-candidate/${RELEASE_TAG}-evidence.json#Release candidate evidence" \
            --repo "$SOURCE_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --draft \
            --title "$RELEASE_TAG" \
            --notes-file ".tmp/release-candidate/${RELEASE_TAG}-notes.md" \
            "${release_args[@]}"

          gh release edit "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --draft=false

          for attempt in 1 2 3 4 5; do
            if gh release verify "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --format json \
              > .tmp/release-candidate/${RELEASE_TAG}-release-attestation.json; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 5
          done

  cleanup-old-releases:
    name: Cleanup Old Docker Hub Tags
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker-release, release-candidate-publication]
    permissions: {}

    steps:
      - name: Get Docker Hub token
        id: docker-token
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get and delete old Docker Hub tags (keep last 5)
        run: |
          set -euo pipefail
          
          TOKEN="${{ steps.docker-token.outputs.token }}"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Docker Hub token is missing/invalid. Ensure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are set."
            exit 1
          fi
          
          KEEP_COUNT=5
          REPO="cloudbyday90/classifarr"
          
          # Fetch all tags (paginated), then delete everything except:
          # - latest (if present)
          # - the newest $KEEP_COUNT tags by last_updated (excluding latest)
          NEXT_URL="https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100"
          ALL="[]"
          
          while [ -n "$NEXT_URL" ] && [ "$NEXT_URL" != "null" ]; do
            RESP="$(curl --fail-with-body -sSL -H "Authorization: Bearer ${TOKEN}" "$NEXT_URL")"
            ALL="$(jq -s ".[0] + .[1].results" <(echo "$ALL") <(echo "$RESP"))"
            NEXT_URL="$(echo "$RESP" | jq -r ".next")"
          done
          
          TAGS_SORTED="$(echo "$ALL" | jq -r "sort_by(.last_updated) | .[].name")"
          TAG_COUNT="$(echo "$TAGS_SORTED" | grep -v "^latest$" | wc -l | tr -d " ")"
          
          echo "Docker Hub tags (excluding latest): $TAG_COUNT"
          
          if [ "$TAG_COUNT" -le "$KEEP_COUNT" ]; then
            echo "Only $TAG_COUNT tags exist, keeping all (minimum is $KEEP_COUNT)"
            exit 0
          fi
          
          DELETE_COUNT="$((TAG_COUNT - KEEP_COUNT))"
          echo "Deleting $DELETE_COUNT old tags from Docker Hub (keeping newest $KEEP_COUNT + latest)..."
          
          TAGS_TO_DELETE="$(echo "$TAGS_SORTED" | grep -v "^latest$" | head -n "$DELETE_COUNT")"
          
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting tag: $TAG"
            curl --fail-with-body -sSL -X DELETE \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${REPO}/tags/${TAG}/" >/dev/null
            sleep 0.1
          done <<< "$TAGS_TO_DELETE"

