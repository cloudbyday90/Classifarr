name: Resource Capacity Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Synthetic workload size
        type: choice
        required: true
        default: smoke
        options: [smoke, capacity, budgets]

permissions:
  contents: read

concurrency:
  group: resource-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-capacity:
    name: Queued Work Recovery and Resource Safety
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Run short resource gate
        if: github.event_name != 'workflow_dispatch' || inputs.profile == 'smoke'
        run: node scripts/run-resource-study.mjs --smoke
      - name: Run opt-in capacity gate
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'capacity'
        run: node scripts/run-resource-study.mjs --capacity
      - name: Compare isolated CPU and PID budgets
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'budgets'
        run: node scripts/run-resource-study.mjs --budget-comparison
      - name: Upload aggregate resource evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-capacity-result
          path: |
            .tmp/resource-study/classifarr-resource-study-*/result.json
            .tmp/resource-study/comparison-*/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
