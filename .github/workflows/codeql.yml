name: CodeQL Analysis

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'logo/**'
  push:
    branches: [ main ]
  schedule:
    # Weekly scan on Monday at 02:00 UTC (low-traffic window)
    - cron: '0 2 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'actions' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          languages: ${{ matrix.language }}
          # security-extended covers OWASP Top 10 and additional CWEs beyond the default suite
          queries: security-extended
          # Exclude generated/test artifacts from analysis for cleaner SARIF results
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/*.test.js'
              - '**/*.spec.js'
              - 'client/coverage/**'
              - 'server/coverage/**'
              - 'client/dist/**'
              - '.tmp/**'

      # JavaScript/TypeScript does not require a build step
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          category: "/language:${{ matrix.language }}"
