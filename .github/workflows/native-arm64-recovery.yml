name: Native ARM64 Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-arm64-recovery.yml'
      - '.dockerignore'
      - '.nvmrc'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'docker-compose.published-upgrade-drill.yml'
      - 'client/**'
      - 'server/**'
      - 'database/**'
      - 'scripts/lib/**'
      - 'scripts/fixtures/published-upgrade/**'
      - 'scripts/run-native-arm64-recovery.mjs'
      - 'scripts/run-runtime-installation-acceptance.mjs'
      - 'scripts/__tests__/native-arm64-recovery.test.mjs'

permissions:
  contents: read

jobs:
  native-arm64-recovery:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Check native rehearsal contract
        run: node --test scripts/__tests__/native-arm64-recovery.test.mjs
      - name: Rehearse scheduled crash recovery
        id: recovery
        run: node scripts/run-native-arm64-recovery.mjs
      - name: Upload native recovery receipt
        if: ${{ !cancelled() && (steps.recovery.outcome == 'success' || steps.recovery.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-arm64-recovery
          path: .tmp/ci/native-arm64-recovery.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized startup diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-arm64-recovery-diagnostics
          path: .tmp/published-upgrade/classifarr-upgrade-drill-*/failure.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
