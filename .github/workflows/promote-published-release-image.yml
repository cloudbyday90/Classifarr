name: Promote Published Release Image Alias

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Verified immutable v3-evidence release to promote in both registries
        required: true
        type: string
  workflow_call:
    inputs:
      source_tag:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      image_digest:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  promote-latest:
    name: Promote verified release digest to latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') && github.ref_name == inputs.source_tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publication
    concurrency:
      group: classifarr-published-latest
      cancel-in-progress: false
    permissions:
      attestations: read
      contents: read
      packages: write
    steps:
      - name: Checkout promotion code and ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify release and promote exact indexes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: node scripts/promote-release-images.mjs --write
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-release-image-alias-promotion
          path: .tmp/ci/published-release-image-alias-promotion.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
