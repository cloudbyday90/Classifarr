name: OSV Dependency Scan

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'logo/**'
  merge_group:
    branches: [ main ]  # Required if a merge queue is configured
  push:
    branches: [ main ]  # Full scan on every merge to main (catches hotfixes/bot commits)
    tags:
      - "v*"
  schedule:
    # Weekly full scan on Thursday at 02:00 UTC
    # (staggered: CodeQL Mon, Trivy Tue, Gitleaks Wed)
    - cron: '0 2 * * 4'
  workflow_dispatch:  # Allow manual triggering for incident response

# Permissions required by all reusable OSV workflows
permissions:
  actions: read           # Required to upload SARIF to CodeQL
  security-events: write  # Required to upload SARIF to Security tab
  contents: read

jobs:
  # PR scan: compares base vs head — only fails on NEW vulnerabilities introduced by the PR
  pr-scan-dependabot:
    name: OSV Scan (PR, Dependabot)
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OSV scan (no SARIF upload for Dependabot PRs)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

  pr-scan:
    name: OSV Scan (PR)
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      fail-on-vuln: true

  merge-group-scan:
    name: OSV Scan (Merge Group)
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      fail-on-vuln: true

  # Full scan: runs on push to main, release tags, scheduled, and manual trigger.
  # Reports ALL known vulnerabilities (not just new ones) to the Security tab.
  full-scan:
    name: OSV Scan (Full)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      fail-on-vuln: true
