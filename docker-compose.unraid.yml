version: '3.8'

# Docker Compose for Classifarr on UnRaid
# This file is optimized for UnRaid's folder structure and conventions

services:
  classifarr:
    # pgvector auto-selects AVX when supported, otherwise uses generic build
    image: ghcr.io/cloudbyday90/classifarr:latest
    container_name: classifarr
    user: "${PUID:-99}:${PGID:-100}"
    ports:
      - "21324:21324"
    environment:
      # User/Group IDs - Default to UnRaid's nobody:users (99:100)
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - UMASK=${UMASK:-022}
      # Application settings
      - NODE_ENV=production
      - TZ=${TZ:-America/New_York}
      # Cap Node.js heap to 1536 MB — leaves headroom within the 2 GB container
      # memory limit. Without this Node v18+ auto-sizes to ~4 GB and an OOM
      # kill produces no error log. Tune TASK_QUEUE_RETENTION_DAYS (default 7)
      # to control how long completed tasks are retained before auto-cleanup.
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=1536}
      - TASK_QUEUE_RETENTION_DAYS=${TASK_QUEUE_RETENTION_DAYS:-7}
    volumes:
      # Main application data including embedded PostgreSQL
      - /mnt/user/appdata/classifarr:/app/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:21324/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - classifarr_internal
    # Optional: Assign to a specific UnRaid network
    # network_mode: br0
    # Memory limits — strongly recommended to prevent OOM kills.
    # The NODE_OPTIONS heap cap above must stay below this value.
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

networks:
  classifarr_internal:
    name: classifarr_internal
