services:
  classifarr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PGVECTOR_BUILD: ${PGVECTOR_BUILD:-multi}
        VCS_REF: ${VCS_REF:-unknown}
    image: ghcr.io/cloudbyday90/classifarr:latest
    container_name: classifarr
    user: "1000:1000"
    ports:
      - "21324:21324"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/New_York}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      CLASSIFARR_RUNTIME_MODE: ${CLASSIFARR_RUNTIME_MODE:-normal}
      # Keep startup until the embedded OS/authentication cutover is available.
      CLASSIFARR_SCHEMA_MAINTENANCE: ${CLASSIFARR_SCHEMA_MAINTENANCE-startup}
      # Cap V8 old space, not total RSS. The shared 2 GB container limit must
      # also cover native buffers, other V8 spaces and PostgreSQL; validate peak
      # headroom before increasing this value. TASK_QUEUE_RETENTION_DAYS
      # controls completed-task history, not active worker concurrency.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
      TASK_QUEUE_RETENTION_DAYS: ${TASK_QUEUE_RETENTION_DAYS:-7}
      # Runtime pgvector staging is opportunistic: use AVX/AVX2 when the
      # PostgreSQL runtime mount permits it, otherwise fall back to generic.
      PGVECTOR_RUNTIME_STAGING: ${PGVECTOR_RUNTIME_STAGING:-auto}
    volumes:
      - ./data:/app/data
      # Required for re-classification moves: replace host path with your media root
      - /path/to/media:/data/media:rw
    restart: unless-stopped
    # Drain Node before PostgreSQL; leave headroom above the bounded stop budgets.
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=770
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: 2G
    # Explicit healthcheck so the start_period is visible and tunable without
    # an image rebuild. Mirrors the Dockerfile HEALTHCHECK but with a 120s
    # start_period to cover pg_upgrade paths and fresh installs on slow hosts.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:21324/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - classifarr_internal

networks:
  classifarr_internal:
    name: classifarr_internal
