services:
  classifarr:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/cloudbyday90/classifarr:latest
    container_name: classifarr
    ports:
      - "21324:21324"
    environment:
      - PUID=1000 # Your user ID (run `id -u` to find)
      - PGID=1000 # Your group ID (run `id -g` to find)
      - TZ=America/New_York # Your timezone
    volumes:
      - ./data:/app/data
      # ═══════════════════════════════════════════════════════════════
      # MEDIA ACCESS (Required for Re-Classification feature)
      # ═══════════════════════════════════════════════════════════════
      # Map your media folders so Classifarr can move files during
      # re-classification. Write access is required.
      #
      # Format: /host/path:/container/path
      #
      # Example for single media folder:
      # - /mnt/user/media:/data/media
      #
      # Example for separate movie/tv folders:
      # - /mnt/user/movies:/data/movies
      # - /mnt/user/tv:/data/tv
      # ═══════════════════════════════════════════════════════════════
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:21324/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
